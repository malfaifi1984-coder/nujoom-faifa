<!doctype html><html lang="ar" dir="rtl" style="background:#0b1220;color-scheme:dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>تحديث نجوم فيفاء</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0b1220;color:#e7edf7;font:17px/1.9 system-ui,Tahoma,sans-serif}main{width:min(440px,100%);padding:32px 24px;text-align:center}h1{font-size:25px;color:#dfc99f}p{color:#aabbd1}button,a{display:block;width:100%;font:inherit;padding:12px;border-radius:12px;margin-top:14px}button{background:#d6bf92;color:#142238;border:0;cursor:pointer}button:disabled{opacity:.6}a{color:#c4d9ef;text-underline-offset:4px}</style></head><body><main><h1>نجوم مذاري فيفاء</h1><p id="status" role="status" aria-live="polite">جارٍ تحديث التطبيق…</p><p>ستبقى إعداداتك وتفضيلات التنبيهات محفوظة.</p><button id="retry" type="button" hidden>إعادة المحاولة</button><a href="/">فتح التطبيق</a></main><script>
(() => {
  const status = document.getElementById('status'), retry = document.getElementById('retry');
  let busy = false;
  async function repair() {
    if (busy) return;
    busy = true; retry.hidden = true;
    status.textContent = 'جارٍ تحديث التطبيق…';
    let timer;
    try {
      if (!('serviceWorker' in navigator)) { location.replace('/?updated=fast2'); return; }
      await Promise.race([(async () => {
        const registration = await navigator.serviceWorker.register('/sw.js', {scope: '/', updateViaCache: 'none'});
        await registration.update();
        const worker = registration.installing || registration.waiting;
        if (worker && worker.state !== 'activated') await new Promise((resolve, reject) => {
          function check() {
            if (worker.state === 'activated') resolve();
            else if (worker.state === 'redundant') reject(new Error('Update failed'));
          }
          worker.addEventListener('statechange', check); check();
        });
        await navigator.serviceWorker.ready;
      })(), new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('Update timeout')), 20000); })]);
      status.textContent = 'تم التحديث. جارٍ فتح التطبيق…';
      location.replace('/?updated=fast2');
    } catch (_) {
      status.textContent = 'تعذر إكمال التحديث. تحقق من الاتصال ثم أعد المحاولة.';
      retry.hidden = false;
    } finally { clearTimeout(timer); busy = false; }
  }
  retry.addEventListener('click', repair);
  repair();
})();
</script></body></html>
